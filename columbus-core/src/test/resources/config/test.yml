server:
  maxThreads: 128
  minThreads: 128
  applicationConnectors:
    - type: http
      port: 9080
  adminConnectors:
    - type: http
      port: 9081
  applicationContextPath: /
  requestLog:
    appenders:
      - type: console
        timeZone: IST

logging:
  level: INFO

  # Logger-specific levels.
  loggers:
    example.invalid: DEBUG
    example.invalid: DEBUG

  appenders:
    - type: console
      threshold: INFO
      timeZone: IST
      logFormat: "%(%-5level) [%date] [%thread] [%logger{0}]: %message%n"

coreConfig:
  workerConfig:
    configType: KAFKA_WORKER_CONFIG
    kafkaConfig:
      timeoutMs: 10000
      callbackParallelism: 1
      retryMs: 100
      blockingSleepMs: 1000
      shutdownWaitTimeMs: 10000

      allTopicConfig:
        entityConfigMap:
          default_topic:
            topicName: "xyz"
            numPartitions: 2

      allConsumerConfig:
        entityConfigMap:
          default_topic:
            topicName: "xyz"
            groupName: "xyz"

      producerConfig:
        bootstrapServers: example.invalid:6667,example.invalid:6667,example.invalid:6667
        acks: all
        retries: 0
        batchSize: 1048576
        lingerMs: 0
        bufferMemory: 16777216

      consumerConfig:
        bootstrapServers: example.invalid:6667,example.invalid:6667,example.invalid:6667


  elasticConfiguration:
    clusterName: stg-es4xx
    servers:
      - example.invalid:9200
      - example.invalid:9200
      - example.invalid:9200